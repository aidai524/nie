<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>报价巡检面板 | Route Observability</title>
  <style>
:root { color-scheme: light; --background:#f4f4f4; --foreground:#181818; --surface:#fcfcfc; --surface-alt:#e9e9e9; --border:#d9d9d9; --muted:#676767; --yellow:#faff69; --yellow-soft:#f0f2a5; --red:#b03830; --orange:#9d641c; --green:#28724c; --ring:#181818; --radius:12px; }
* { box-sizing:border-box; border-color:var(--border); }
html { background:var(--background); }
body { margin:0; background:var(--background); color:var(--foreground); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button,input,select { font:inherit; }
button:focus-visible,input:focus-visible,select:focus-visible,[role="button"]:focus-visible { outline:2px solid var(--foreground); outline-offset:2px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.dashboard-shell { max-width:1280px; margin:0 auto; padding:26px 32px 42px; }
.topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:22px; }
.brand { display:flex; align-items:center; gap:13px; }.brand-mark { display:grid; place-items:center; width:35px; height:35px; background:var(--foreground); color:var(--yellow); border-radius:8px; font:700 24px/1 "JetBrains Mono", monospace; }.eyebrow { color:var(--muted); font:600 10px/1.4 "JetBrains Mono", monospace; letter-spacing:.12em; }.brand h1 { margin:4px 0 0; font-size:19px; letter-spacing:-.5px; }.top-actions { display:flex; align-items:center; gap:10px; font-size:11px; }.mono { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:12px; }.muted { color:var(--muted); }.live-dot,.fresh-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }.refresh-button { height:40px; margin-left:13px; padding:0 16px; border:0; border-radius:8px; background:var(--foreground); color:var(--surface); cursor:pointer; font-size:12px; }.refresh-button:hover { background:#383838; }
.overview { display:flex; justify-content:space-between; align-items:flex-end; padding:34px 0 27px; }.headline { margin:8px 0 9px; font-size:24px; font-weight:700; letter-spacing:-1px; }.freshness { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12px; }.separator { color:var(--muted); }.stats { display:flex; gap:1px; align-items:stretch; }.stat { min-width:104px; padding:11px 15px 10px; border-left:1px solid var(--border); }.stat span { display:block; color:var(--muted); font-size:11px; }.stat strong { display:block; color:var(--foreground); font:700 28px/1.2 "JetBrains Mono", monospace; letter-spacing:-2px; }.stat-fail strong { color:var(--red); }
.toolbar { display:flex; align-items:center; gap:8px; padding:13px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }.search-label,.select-label { display:flex; align-items:center; height:40px; background:var(--surface); border:1px solid var(--border); border-radius:8px; }.search-label { width:248px; padding:0 11px; gap:8px; }.search-icon { color:var(--muted); font-size:20px; line-height:1; }.search-label input { width:100%; border:0; outline:0; background:transparent; color:var(--foreground); font-size:12px; }.search-label input::placeholder { color:var(--muted); }.select-label { padding:0 10px; }.select-label select { border:0; outline:0; background:var(--surface); color:var(--foreground); font-size:12px; }.issue-toggle { display:flex; align-items:center; gap:8px; height:40px; padding:0 13px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--muted); cursor:pointer; font-size:12px; }.issue-toggle input { position:absolute; opacity:0; }.toggle-box { width:15px; height:15px; border:1px solid #b3b3b3; border-radius:3px; }.issue-toggle input:checked + .toggle-box { background:var(--foreground); box-shadow:inset 0 0 0 3px var(--surface); }.result-count { margin-left:auto; color:var(--muted); font:11px "JetBrains Mono", monospace; }.legend { display:flex; flex-wrap:wrap; gap:3px 14px; margin:13px 0 15px; color:var(--muted); font-size:11px; }.legend span + span::before { content:"· "; }
.table-card { overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:12px; }.table-scroll { overflow-x:auto; } table { width:100%; min-width:1020px; border-collapse:collapse; text-align:left; } th { padding:12px 13px; background:var(--surface-alt); color:var(--muted); font:600 10px "JetBrains Mono", monospace; letter-spacing:.03em; white-space:nowrap; } td { padding:12px 13px; border-top:1px solid var(--border); font-size:12px; white-space:nowrap; } tbody tr[role="button"] { cursor:pointer; } tbody tr[role="button"]:hover, tbody tr.is-expanded { background:#f5f5f5; } td:first-child { min-width:150px; } td:first-child strong { font-size:12px; } td:first-child small { display:block; margin-top:4px; color:var(--muted); font-size:10px; }.arrow { margin:0 7px; color:#929292; }.status { display:inline-flex; align-items:center; height:23px; padding:0 8px; border-radius:999px; font-size:11px; }.status-正常 { background:#dcefe0; color:#286643; }.status-偏离 { background:var(--yellow-soft); color:#655f1c; }.status-失败 { background:#f4d9d5; color:var(--red); }.status-未报价 { background:#e6e6e6; color:var(--muted); }.deviation { color:#856400; }.depth-value { font-weight:600; }.detail-row td { padding:0; background:#efefef; }.detail-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:18px 22px 20px; }.detail-grid div { display:flex; flex-direction:column; gap:5px; }.detail-grid span { color:var(--muted); font:10px "JetBrains Mono", monospace; }.detail-grid b { font:12px "JetBrains Mono", monospace; font-weight:500; }.depth-detail, .failure-detail { grid-column:span 4; padding-top:7px; border-top:1px solid var(--border); }
    /* 每个档位是独立的一块 —— 拼成一行文本会被当成「一条数据」 */
    .depth-detail .tier-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:7px; }
    .depth-detail .tier { min-width:120px; padding:7px 10px; background:var(--background); border:1px solid var(--border); border-radius:8px; font-family:"JetBrains Mono", ui-monospace, monospace; font-size:12px; }
    .depth-detail .tier b { display:block; font-weight:600; }
    .depth-detail .tier small { display:block; margin-top:2px; color:var(--muted); font-size:10px; }
    .depth-detail .tier.is-ok b { color:var(--green); }
    .depth-detail .tier.is-bad b { color:var(--red); }
    /* 失败原文占满一行：它可能很长，挤在四分之一列里读不了 */
    .failure-detail b { color:var(--red); font-weight:500; white-space:normal; } footer { display:flex; justify-content:space-between; padding-top:16px; color:var(--muted); font-size:10px; }
@media (max-width:1024px) { .dashboard-shell { padding:22px 20px 34px; }.hide-medium { display:none; } }
@media (max-width:768px) { .dashboard-shell { padding:18px 14px 28px; }.topbar,.overview { align-items:flex-start; flex-direction:column; gap:18px; }.top-actions { width:100%; }.refresh-button { margin-left:auto; }.overview { padding:26px 0 20px; }.headline { font-size:21px; }.stats { width:100%; }.stat { flex:1; }.toolbar { flex-wrap:wrap; }.search-label { flex:1 1 220px; }.result-count { width:100%; margin-left:0; }.legend { line-height:1.7; }.detail-grid { grid-template-columns:repeat(2,1fr); }.depth-detail { grid-column:span 2; } footer { gap:10px; flex-direction:column; } }
@media (max-width:480px) { .top-actions .mono { display:none; } .stats strong { font-size:24px; } }
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; transition:none !important; } }

    /* ==========================================================================
       以下为「参考 UI 未覆盖、由本项目推导」的部分。参考 UI 是一个静态设计原型
       （ui/app/page.tsx，v0 生成、硬编码假数据），没有服务不可达 / 空库 / 需要令牌 /
       深度扫描关闭这些运行态。这里用同一套令牌与类名语言补上，不引入新颜色。

       参考 UI 自身的调色板有 5 处不达 WCAG AA，已在移植时做了最小修正（保持色相）：
         --muted  #697069 → #636963（压暗 6%）  表头 4.43→4.90、未报价徽章 4.08→4.51
         --red    #b83b32 → #b03830（压暗 5%）  失败徽章 4.24→4.55
         搜索框 placeholder  #8b928a → var(--muted)（3.10→5.46）
         分隔符 ·            #a6ada3 → var(--muted)（2.10→5.14）

         2026-09-16 **中性化**：中性色的色相由参考 UI 的暖绿（H72 S20%）改为**中性灰**。
         做法是「保留原相对亮度、只去色相」，所以明度台阶与全部对比度关系照旧
         （实测相邻表面台阶 1.0634→1.0721，仍 ≥1.05）。灰阶取自一条后台 UI 设计录屏的实测值：
         其卡片 #fcfcfc、表头 #e9e9e9 与本系统同亮度中性化的结果**完全一致**。
         语义色（--yellow / --yellow-soft / --red / --orange / --green 与四个徽章底色）本期未动，
         所以此刻绿黄的强调色是页面上仅剩的暖色 —— 那是**有意留下的中间状态**。
       ========================================================================== */

    .banner { margin:0 0 14px; padding:11px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); font-size:12px; }
    .banner.err { border-color:var(--red); color:var(--red); }
    .banner.warn { border-color:var(--orange); color:var(--orange); }
    .banner[hidden], .token-box[hidden], .empty[hidden], .stat[hidden] { display:none; }

    .token-box { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 14px; padding:11px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); font-size:12px; }
    .token-box input { height:40px; padding:0 11px; background:var(--background); color:var(--foreground); border:1px solid var(--border); border-radius:8px; font-size:12px; }
    .token-box button { height:40px; padding:0 16px; border:0; border-radius:8px; background:var(--foreground); color:var(--surface); cursor:pointer; font-size:12px; }

    .empty { margin:16px 0 0; color:var(--muted); font-size:12px; }

    /* 深度扫描关闭时整列消失 —— 否则会与「全档不通」的破折号长得一样 */
    .no-depth .depth-col { display:none; }

    /* 服务状态点的三种颜色（参考 UI 只有在线一种） */
    .live-dot.is-down { background:var(--red); }
    .fresh-dot.is-stale { background:var(--orange); }

    /* 未报价的统计项只在非零时出现，避免「0 0 0」被读成一切正常 */
    .stat-none strong { color:var(--muted); }

    /* 数字列右对齐 —— 左对齐时 $1,501.96 与 $9.99 的小数点对不齐，竖向扫不出大小。
       用 nth-child 而不是类名：丢列走的是 display:none，不改变 DOM 序号，
       所以 .hide-medium / .no-depth 隐藏列后这里的对位依然正确。 */
    th:nth-child(4), th:nth-child(5), th:nth-child(6), th:nth-child(7), th:nth-child(8),
    td:nth-child(4), td:nth-child(5), td:nth-child(6), td:nth-child(7), td:nth-child(8) { text-align:right; }

    /* 行按参考 UI 是可交互元素（role=button + tabindex），但父级 .table-scroll 是
       overflow-x:auto —— 它同时是纵向滚动容器，所以画在行外的焦点框会被裁掉，
       首行/末行 Tab 过去看不见。offset 取负，把 outline 收到行内边界。
       不用 box-shadow:inset：那会同时换掉机制和属性，而 outline 是已在用的。 */
    tbody tr[role="button"]:focus-visible { outline-offset:-2px; }
  </style>
</head>

<body>
  <main class="dashboard-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">/</span>
        <div>
          <div class="eyebrow">ROUTE OBSERVABILITY</div>
          <h1>报价巡检面板</h1>
        </div>
      </div>
      <div class="top-actions">
        <span class="live-dot" id="live-dot"></span>
        <span class="mono muted" id="api-state">连接中…</span>
        <button type="button" class="refresh-button" id="refresh">刷新数据</button>
      </div>
    </header>

    <section class="overview" aria-label="概览">
      <div>
        <p class="eyebrow">QUOTATION HEALTH</p>
        <p class="headline" id="headline">全部路由的当前报价状态</p>
        <p class="freshness">
          <span class="fresh-dot" id="fresh-dot"></span>
          <span id="freshness">正在加载…</span>
          <span class="separator">·</span>
          <span id="next-refresh"></span>
        </p>
      </div>
      <div class="stats">
        <div class="stat"><span>正常</span><strong id="count-ok">—</strong></div>
        <div class="stat"><span>偏离</span><strong id="count-deviant">—</strong></div>
        <div class="stat stat-fail"><span>失败</span><strong id="count-error">—</strong></div>
        <div class="stat stat-none" id="stat-none" hidden><span>未报价</span><strong id="count-unknown">—</strong></div>
      </div>
    </section>

    <div class="banner" id="banner" hidden></div>

    <div class="token-box" id="token-box" hidden>
      <span>服务配了访问令牌，请填入：</span>
      <input id="token-input" type="password" placeholder="Bearer token" autocomplete="off" />
      <button type="button" id="token-save">保存并重试</button>
    </div>

    <section class="toolbar" aria-label="过滤器">
      <label class="search-label">
        <span class="sr-only">搜索币对</span>
        <span class="search-icon">⌕</span>
        <input id="search" placeholder="搜索源或目标币种" autocomplete="off" />
      </label>
      <label class="select-label">
        <span class="sr-only">选择链</span>
        <select id="chain-select"><option value="">全部链</option></select>
      </label>
      <label class="issue-toggle">
        <input type="checkbox" id="only-problems" />
        <span class="toggle-box"></span>仅异常
      </label>
      <span class="result-count" id="shown-count"></span>
    </section>

    <p class="legend">
      <span>成本 = 付出与所得的美元差额</span>
      <span>较基准 = 相对近 1 小时成功报价中位数（偏离阈值 10%，服务端配置）</span>
      <span>可按 = 已验证可通过的最大金额档位（$ 为名义美元）</span>
    </p>

    <section class="table-card">
      <div class="table-scroll">
        <table id="table">
          <thead>
            <tr>
              <th>币对</th>
              <th>状态</th>
              <th>付 → 得</th>
              <th class="hide-medium">USD</th>
              <th>成本</th>
              <th>较基准</th>
              <th class="depth-col">可按</th>
              <th class="hide-medium">延迟</th>
              <th>最后报价</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <p class="empty" id="empty" hidden></p>

    <footer>
      <span>数据源：/pairs · /latest · /stats?window=1h · /health · /depth</span>
      <span class="mono">轮询间隔 30s</span>
    </footer>
  </main>

  <script type="module">
    import { init } from "/dashboard.js";
    init();
  </script>
</body>

</html>
